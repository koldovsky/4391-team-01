<section class="promo-video">
  <div class="promo-video__preview container">
    <button class="promo-video__play-btn">
      <svg
        class="promo-video__play-icon"
        xmlns="http://www.w3.org/2000/svg"
        version="1.1"
        viewBox="0 0 100 99.999"
        height="20px"
      >
        <polygon
          fill="currentColor"
          points="35.783,69 35.783,29 69,49.143 "
        ></polygon>
      </svg>
    </button>
  </div>
  <div class="promo-video__overlay"></div>
  <div class="promo-video__modal">
    <iframe
      class="promo-video__iframe"
      src="https://www.youtube.com/embed/_KMbRIrI-t8?si=gPVqLjjvbQRMXAQb"
      title="YouTube video player"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
      height="300px"
      width="400px"
    ></iframe>
    <button class="promo-video__close-btn">Close</button>
  </div>

  <div class="promo-video__clients container">
    <p class="promo-video__clients-text">
      More than
      <span class="promo-video__clients-count">200+ companies</span> trust us
      worldwide:
    </p>
    <div class="promo-video__clients-list">
      <img
        class="promo-video__client-logo"
        src="img/promo-video/logo-nextgen.svg"
        alt="Logo NextGen"
      />
      <img
        class="promo-video__client-logo"
        src="img/promo-video/logo-digital-world.svg"
        alt="Logo Digital World"
      />
      <img
        class="promo-video__client-logo"
        src="img/promo-video/logo-ecosmart.svg"
        alt="Logo EcoSmart"
      />
      <img
        class="promo-video__client-logo"
        src="img/promo-video/logo-greenstream.svg"
        alt="Logo GreenStream"
      />
      <img
        class="promo-video__client-logo"
        src="img/promo-video/logo-co-wave.svg"
        alt="Logo Co-Wave"
      />
    </div>
  </div>
</section>
